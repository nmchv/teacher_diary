<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#08090b">
<title>Дневник учителя</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
try {
  var raw = localStorage.getItem('teacherDiaryV3');
  var settings = raw ? (JSON.parse(raw).settings || {}) : {};
  var isDark = settings.colorMode ? settings.colorMode === 'dark' : true;
  document.documentElement.classList.toggle('dark', isDark);
} catch (e) {
  document.documentElement.classList.add('dark');
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="src/styles/app.css">
<script src="src/device-detector.js"></script>
<script>
(function(){
  var v = window.currentVersion ? window.currentVersion() : 'desktop';
  if (v === 'mobile') {
    window.location.replace('mobile/index.html');
  }
})();
</script>
</head>
<body><div id="app" class="app"></div><div id="modal"></div><div id="present"></div><div id="assistant-wrap" class="hidden"></div><div id="assistant-toggle" onclick="assistantShow()" title="Показать ассистента">🐾</div>
<script src="src/app.js"></script>
</body></html>
